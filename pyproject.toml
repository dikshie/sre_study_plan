[project]
name = "sre-study-app"
version = "0.1.0"
description = "A simple Flask app for practicing Docker, Kubernetes, CI/CD, and observability"
requires-python = ">=3.12"
dependencies = [
    "flask==3.0.3",
    "prometheus-client==0.20.0",
    "gunicorn==22.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.2",
    "flake8==7.1.0",
    "black==24.4.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
