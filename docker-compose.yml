services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=development
      - APP_VERSION=0.1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3
